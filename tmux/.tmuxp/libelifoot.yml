session_name: libelifoot
windows:
- window_name: dev
  layout: tiled
  shell_command_before:
    - cd $PROJECTS/libelifoot
  panes:
    - $VISUAL libelifoot/libelifoot.py

- window_name: test
  layout: main-horizontal
  shell_command_before:
    - cd $PROJECTS/libelifoot
    - source dev/bin/activate
  panes:
    - pytest -v --cov=libelifoot --cov-report=term-missing tests/
